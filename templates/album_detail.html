{% extends "base.html" %}

{% block obsah %}

    <h1> {{album.nazev}}</h1>    
    <div class="album-detail-mrizka">
        {% for fotka in album.vsechny_fotky %}
            <a href="/static/{{album.id}}/{{fotka}}" class="detail-fotka-kontejner">
                <img src = "/static/{{album.id}}/{{fotka}}"> 
            </a>
        {% endfor %}
    </div>


{% endblock %}
