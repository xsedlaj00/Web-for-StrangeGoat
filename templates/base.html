<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Strange Goat</title>
    <link rel="icon" type="image/x-icon" href="/static/font.png">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<!--forbids right click menu-->
<body>    
    <button id="menu-tlacitko" onclick="prepniMenu()">☰ MENU</button>
    <nav id="bocni-menu">
        <img src="/static/goat.png" alt="koza">
        <ul>
            <!-- Všimni si, kam odkazy směřují (href). To jsou naše budoucí URL adresy. -->
            <li><a href="/">Úvod</a></li>
            <li><a href="/koncerty">Koncerty</a></li>
            <li><a href="/hudba">Hudba</a></li>
            <li><a href="/galerie">Galerie</a></li>
        </ul>
    </nav>
    <button id="login" onclick="Prihlas()"></button>
    <main id="hlavni-obsah">

        {% if request.path != '/' %}
            <nav id="back-kontejner">
                <button id="back-tlacitko" onclick="getBack()">
                    <!--pridat obrazek-->
                    <img src="/static/sipka.png" alt="Zpět">
                </button>
            </nav>
        {% endif %}

        <!-- Sem se bude automaticky vkládat obsah konkrétních stránek -->
        {% block obsah %}{% endblock %}
    </main>
    <script>
        let otvorene_menu=false;
        function prepniMenu() {
            // Najdeme prvek menu podle jeho ID
            otvorene_menu = true;
            var menu = document.getElementById("bocni-menu");
            
            // Funkce toggle() buď přidá, nebo odebere třídu "otevreno".
            // Tím se aplikuje to pravidlo left: 0; z CSS.
            menu.classList.toggle("otevreno");
            
            // 2. Najdeme hlavní obsah a posuneme/vrátíme ho (nová část)
            var obsah = document.getElementById("hlavni-obsah");
            obsah.classList.toggle("posunuto");

            var background = document.getElementById("menu-tlacitko");
            background.classList.toggle("zmiz");
        }
        /* get back fce*/
        function getBack() {
            window.location.href = "/";

        }
        
        /*function zavriMenu()
        {
            // Najdeme prvek menu podle jeho ID
            var menu = document.getElementById("bocni-menu");
            
            // Funkce toggle() buď přidá, nebo odebere třídu "otevreno".
            // Tím se aplikuje to pravidlo left: 0; z CSS.
            menu.classList.remove("otevreno");
            
            // 2. Najdeme hlavní obsah a posuneme/vrátíme ho (nová část)
            var obsah = document.getElementById("hlavni-obsah");
            obsah.classList.remove("posunuto");

            var background = document.getElementById("menu-tlacitko");
            background.classList.add("zmiz");
        }*/

        function Prihlas() {

            window.location.href = "/spravce"; // Tohle se stane až za chvíli
        }

        window.addEventListener("scroll", function() {
            var hero = document.getElementById("hero-sekce");
            
            if (hero) {
                // 1. Zjistíme, jak moc jsme odskrolovali
                var odskrolovano = window.scrollY;
                
                // 2. Zjistíme celkovou výšku aktuálního okna prohlížeče
                var vyskaOkna = window.innerHeight;
                
                // 3. Vypočítej novou výšku: (výška okna MÍNUS to, co jsme odskrolovali)
                var vypocitanaVyska = vyskaOkna - odskrolovano;
                
                // 4. Zastavíme zmenšování na 120 pixelech
                var konecnaVyska = Math.max(120, vypocitanaVyska);
                
                // 5. Nastavíme tu výšku natvrdo prvku
                hero.style.height = konecnaVyska + "px";
            }
        });

        window.addEventListener("scroll", function() {
            var nano = document.querySelector(".nano-koncerty");
            
            if (nano) {
                // 1. Zjistíme, jak moc jsme odskrolovali
                var odskrolovano = window.scrollY;
                
                // 2. Zjistíme celkovou výšku aktuálního okna prohlížeče
                var vyskaOkna = window.innerHeight;
                
                // 3. Vypočítej novou výšku: (výška okna MÍNUS to, co jsme odskrolovali)
                var vypocitanaVyska = vyskaOkna - odskrolovano;
                if (odskrolovano>320 && window.innerWidth<768)
                {
                    nano.classList.add("schovano");
                }
                else
                {
                if (odskrolovano>940){
                    nano.classList.add("schovano");
                    
                }
                else 
                    nano.classList.remove("schovano");
                }
                if (odskrolovano>500 && window.innerWidth>768&&!otvorene_menu){
                                                    // Najdeme prvek menu podle jeho ID
                    var menu = document.getElementById("bocni-menu");
                    
                    // Funkce toggle() buď přidá, nebo odebere třídu "otevreno".
                    // Tím se aplikuje to pravidlo left: 0; z CSS.
                    menu.classList.add("otevreno");
                    
                    // 2. Najdeme hlavní obsah a posuneme/vrátíme ho (nová část)
                    var obsah = document.getElementById("hlavni-obsah");
                    obsah.classList.add("posunuto");

                    var background = document.getElementById("menu-tlacitko");
                    background.classList.add("zmiz");
                }
            }
        });

        /* Potencial music download block
            // Najde všechny audio přehrávače na načtené stránce
            const prehravace = document.querySelectorAll('audio');
            // Všem hromadně přidá atribut proti stahování
            prehravace.forEach(audio => {
                audio.setAttribute('controlsList', 'nodownload');
            });
        */
    </script>

    <footer id="hlavni-zapati">
        <div class="socialni-ikony">
                        <a href="https://www.youtube.com/@StrangegoatCZ" target="_blank" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://www.instagram.com/strangegoatcz/" target="_blank" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            </div>

        <div class="copyright-text">
            <p>&copy; 2026 Strange Goat. Všechna práva vyhrazena.</p>
        </div>
    </footer>
</body>
</html>
