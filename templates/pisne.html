{% extends "base.html" %}

{% block obsah %}
    <h2>Naše hudba</h2>
    {% for pisen in pisnicky_do_html %}
        <h3>{{ pisen.nazev }}</h3>
        <audio controls>
            <source src="/static/{{ pisen.soubor }}" type="audio/mpeg">
            Váš prohlížeč nepodporuje přehrávač zvuku.
        </audio>
    {% endfor %}
{% endblock %}
